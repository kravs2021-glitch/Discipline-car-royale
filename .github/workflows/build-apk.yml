name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Gerar APK Instalável
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar keystore de assinatura e arquivo .env
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK (Debug)
        run: gradle :app:assembleDebug --no-daemon

      - name: Disponibilizar APK nos Artifacts do Actions
        uses: actions/upload-artifact@v4
        with:
          name: Exame-Car-Royale-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar APK direto em Releases (sem precisar extrair ZIP)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Exame-Car-Royale.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Exame-Car-Royale.apk --clobber
          else
            gh release create latest Exame-Car-Royale.apk \
              --title "APK Instalável (Última Versão)" \
              --notes "APK gerado automaticamente pelo GitHub Actions para instalação direta no Android."
          fi
